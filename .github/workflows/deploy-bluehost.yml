name: Deploy Loyalty Wallet plugin to Bluehost

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-loyalty-wallet-bluehost
  cancel-in-progress: false

jobs:
  deploy:
    name: Upload plugin
    runs-on: ubuntu-latest
    environment: Prod

    steps:
      - name: Check out plugin
        uses: actions/checkout@v4

      - name: Upload Loyalty Wallet plugin to Bluehost
        uses: SamKirkland/FTP-Deploy-Action@v4.4.0
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          port: 21
          protocol: ftpss
          security: loose
          local-dir: ./
          server-dir: ./x/
          state-name: .ftp-deploy-sync-state.json
          log-level: standard
          exclude: |
            **/.git*
            **/.git*/**
            **/.github/**
            **/.DS_Store
            **/.env*
            **/*.pem
            **/*.key
            **/credentials*.json
            **/*service-account*.json
